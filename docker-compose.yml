services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agenda
      MYSQL_USER: agenda
      MYSQL_PASSWORD: agenda
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      DATABASE_URL: mysql://agenda:agenda@mysql:3306/agenda
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: "super-secret-access-token-key-2026-secure"
      JWT_REFRESH_SECRET: "super-secret-refresh-token-key-2026-secure"
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Mesma imagem/código da API, iniciada em modo worker: consome a fila BullMQ
  # e roda os @Cron (é o ÚNICO processo que os roda). A API só enfileira.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["pnpm", "--filter", "@agenda/api", "start:worker"]
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: mysql://agenda:agenda@mysql:3306/agenda
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: "super-secret-access-token-key-2026-secure"
      JWT_REFRESH_SECRET: "super-secret-refresh-token-key-2026-secure"
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      NODE_ENV: production
      # O worker é quem ENTREGA e-mails: defina RESEND_API_KEY e MAIL_FROM aqui
      # (e ONLINE_PAYMENTS_ENABLED se for reabrir cobrança). Ver docs/notificacoes.md.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-build:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    volumes:
      - frontend_dist:/frontend-dist
    command: >
      sh -c "cp -r /app/apps/web/out/* /frontend-dist/"

  nginx:
    image: nginx:alpine
    container_name: agenda-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web-build
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  frontend_dist:
