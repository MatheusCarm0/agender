services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agenda
      MYSQL_USER: agenda
      MYSQL_PASSWORD: agenda
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: mysql://agenda:agenda@mysql:3306/agenda
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: troque-em-producao
      JWT_REFRESH_SECRET: troque-em-producao
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      NODE_ENV: development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    volumes:
      - ./apps/web/src:/app/apps/web/src

  # Mesma imagem/código da API, iniciada em modo worker: consome a fila BullMQ
  # e roda os @Cron (é o ÚNICO processo que os roda). A API só enfileira.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@agenda/api", "dev:worker"]
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: mysql://agenda:agenda@mysql:3306/agenda
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: troque-em-producao
      JWT_REFRESH_SECRET: troque-em-producao
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      NODE_ENV: development
      # Para o worker ENTREGAR e-mails de verdade (e não só simular), defina
      # RESEND_API_KEY e MAIL_FROM aqui — é este processo que envia. Ver
      # docs/notificacoes.md.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages

volumes:
  mysql_data:
